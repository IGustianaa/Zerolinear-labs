<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zerolinear — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-bottom:12vh;
    pointer-events:none;z-index:2}
  .tagline{font-family:'Jost',sans-serif;font-weight:300;color:#aeb6c2;
    letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;font-size:12px;
    opacity:0;animation:fade 2s ease 1.4s forwards;text-align:center}
  @keyframes fade{to{opacity:1}}
  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;
    font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.2em;color:#3a3f47;
    text-transform:uppercase;z-index:2;opacity:0;animation:fade 2s ease 2.4s forwards}
  .loader{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#000;
    font-family:'Jost',sans-serif;color:#5b616b;letter-spacing:.3em;font-size:12px;
    text-transform:uppercase;transition:opacity .8s}
</style>
</head>
<body>
<div class="loader" id="loader">Initializing</div>
<canvas id="c"></canvas>
<div class="overlay">
  <div class="tagline">AI Research Lab</div>
</div>
<div class="hint">Drag to orbit</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "troika-three-text": "https://unpkg.com/troika-three-text@0.49.1/dist/troika-three-text.esm.js"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Text } from 'troika-three-text';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.035);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 11);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.enableZoom = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minPolarAngle = Math.PI*0.3;
controls.maxPolarAngle = Math.PI*0.7;

// ---- lights ----
scene.add(new THREE.AmbientLight(0x334155, 0.6));
const key = new THREE.PointLight(0x9fc4ff, 40, 40); key.position.set(4,6,6); scene.add(key);
const rim = new THREE.PointLight(0x0A84FF, 30, 40); rim.position.set(-6,-2,-4); scene.add(rim);

// ---- the mark: spindle + orbital ring (Zerolinear symbol in 3D) ----
const markGroup = new THREE.Group();
markGroup.position.y = 1.1;
scene.add(markGroup);

const whiteEmissive = new THREE.MeshStandardMaterial({
  color:0xffffff, emissive:0xbcd6ff, emissiveIntensity:1.4, roughness:0.25, metalness:0.1
});

// spindle (tapered vertical) — lathe geometry
const pts = [];
for(let i=0;i<=20;i++){ const t=i/20; const y=(t-0.5)*3.4; const r=0.05*Math.sin(Math.PI*t)+0.006; pts.push(new THREE.Vector2(r,y)); }
const spindle = new THREE.Mesh(new THREE.LatheGeometry(pts, 24), whiteEmissive);
markGroup.add(spindle);

// orbital ring (thin torus) tilted
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.03, 16, 160), whiteEmissive);
ring.rotation.x = Math.PI*0.5 - 0.35;
markGroup.add(ring);
// second faint ring
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.85, 0.012, 12, 160),
  new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x6f8fd0,emissiveIntensity:0.7,transparent:true,opacity:0.5}));
ring2.rotation.x = Math.PI*0.5 - 0.55;
markGroup.add(ring2);

// glowing core
const core = new THREE.Mesh(new THREE.SphereGeometry(0.16,32,32),
  new THREE.MeshBasicMaterial({color:0xffffff}));
markGroup.add(core);

// ---- particle starfield ----
const N=1400; const pos=new Float32Array(N*3);
for(let i=0;i<N;i++){ const r=6+Math.random()*22; const th=Math.random()*Math.PI*2; const ph=Math.acos(2*Math.random()-1);
  pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph)*0.6; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th); }
const pg=new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
const stars=new THREE.Points(pg, new THREE.PointsMaterial({color:0x8aa0c0,size:0.03,transparent:true,opacity:0.8}));
scene.add(stars);

// ---- 3D live text: ZEROLINEAR ----
const textMesh = new Text();
textMesh.text = 'ZEROLINEAR';
textMesh.font = 'https://fonts.gstatic.com/s/jost/v15/92zPtBhPNqw79Ij1E865zBUv7myjJQVGPokMmuHL.woff';
textMesh.fontSize = 0.92;
textMesh.letterSpacing = 0.28;
textMesh.anchorX = 'center';
textMesh.anchorY = 'middle';
textMesh.position.set(0,-1.9,0);
textMesh.material = new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xdfeaff,emissiveIntensity:0.9,roughness:0.3,metalness:0.2});
textMesh.sync(()=>{ ready(); });
scene.add(textMesh);

// ---- bloom ----
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.9, 0.5, 0.2);
composer.addPass(bloom);

let started=false;
function ready(){ if(started) return; started=true;
  const l=document.getElementById('loader'); l.style.opacity=0; setTimeout(()=>l.remove(),800); }
setTimeout(ready, 3500); // fallback

// ---- animate ----
const clock=new THREE.Clock();
function animate(){
  const t=clock.getElapsedTime();
  ring.rotation.z = t*0.5;
  ring2.rotation.z = -t*0.35;
  markGroup.rotation.y = Math.sin(t*0.3)*0.25;
  markGroup.position.y = 1.1 + Math.sin(t*0.8)*0.08;
  core.scale.setScalar(1+Math.sin(t*2)*0.12);
  stars.rotation.y = t*0.02;
  // text alive: gentle float + breathing glow
  textMesh.position.y = -1.9 + Math.sin(t*0.9)*0.06;
  textMesh.rotation.x = Math.sin(t*0.4)*0.04;
  if(textMesh.material) textMesh.material.emissiveIntensity = 0.75 + Math.sin(t*1.6)*0.35;
  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
